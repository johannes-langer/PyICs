[project]
name = "pyics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "johannes-langer", email = "johannes.langer@uni-bamberg.de" }
]
requires-python = ">=3.14"
dependencies = [
    "jsonargparse>=4.48.0",
    "pyfiglet>=1.0.4",
    "rich>=15.0.0",
    "ruff>=0.15.12",
    "snoop>=0.6.0",
]

[project.scripts]
pyics = "pyics:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
