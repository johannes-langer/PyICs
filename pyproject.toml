[project]
name = "pyics"
version = "0.0.1"
description = "PyICs (Python Interactive Courses) is a modular framework for teaching programming in Python locally, allowing for co-learning of a programming environment."
readme = "README.md"
authors = [
    { name = "johannes-langer", email = "johannes.langer@uni-bamberg.de" }
]
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6 ; sys_platform == 'win32'",
    "ipykernel>=7.3.0",
    "json-tricks>=3.17.3",
    "jsonargparse>=4.48.0",
    "packaging>=24",
    "platformdirs>=4",
    "pluggy>=1.5",
    "prompt-toolkit>=3.0.53",
    "pyfiglet>=1.0.4",
    "pytest>=9.0.3",
    "rich>=15.0.0",
    "ruff>=0.15.12",
    "snoop>=0.6.0",
]

[project.optional-dependencies]
# live results in notebooks (see plugins/pyics-jupyter)
jupyter = ["pyics-jupyter"]

[project.scripts]
pyics = "pyics.scripts.main:run"

[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
pyics-jupyter = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
