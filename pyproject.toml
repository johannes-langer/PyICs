[project]
name = "pyics"
version = "0.0.1"
description = "PyICs (Python Interactive Courses) is a modular framework for teaching programming in Python locally, allowing for co-learning of a programming environment."
readme = "README.md"
authors = [
    { name = "johannes-langer", email = "johannes.langer@uni-bamberg.de" }
]
requires-python = ">=3.14"
dependencies = [
    "fullsignatureprotocols",
    "ipykernel>=7.3.0",
    "json-tricks>=3.17.3",
    "jsonargparse>=4.48.0",
    "pyfiglet>=1.0.4",
    "pytest>=9.0.3",
    "rich>=15.0.0",
    "ruff>=0.15.12",
    "snoop>=0.6.0",
]

[project.scripts]
pyics = "pyics.main:run"
create_task = "pyics.task:create_task"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
fullsignatureprotocols = { git = "https://github.com/johannes-langer/full-signature-protocols" }
