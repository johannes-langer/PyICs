[project]
name = "python-interactive-courses"
version = "1.0.3"
description = "PyICs (Python Interactive Courses) is a modular framework for teaching programming in Python locally, allowing for co-learning of a programming environment."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "johannes-langer", email = "johannes.langer@uni-bamberg.de" }
]
dependencies = [
    "colorama>=0.4.6 ; sys_platform == 'win32'",
    "ipykernel>=7.3.0",
    "json-tricks>=3.17.3",
    "jsonargparse>=4.48.0",
    "packaging>=24",
    "platformdirs>=4",
    "pluggy>=1.5",
    "prompt-toolkit>=3.0.53",
    "pyfiglet>=1.0.4",
    "pytest>=9.0.3",
    "rich>=15.0.0",
    "ruff>=0.15.12",
    "snoop>=0.6.0",
]

[project.urls]
Repository = "https://github.com/johannes-langer/PyICs"
Issues = "https://github.com/johannes-langer/PyICs/issues"

[project.scripts]
pyics = "pyics.scripts.main:run"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pyics"
